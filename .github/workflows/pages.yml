name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundles, demo showcase, CNAME, and asset bundles
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/demo

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  notify:
    name: Discord Pages Notification
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch Pages deployment status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="🌐 Pages Deployed — picotol"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ Pages Deployment Cancelled — picotol"
          else
            COLOR=15087942
            TITLE="❌ Pages Deployment Failed — picotol"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "URL", value: "https://picotol.kidthales.com", inline: true }
                ],
                footer: {
                  text: "GitHub Actions • picotol",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
