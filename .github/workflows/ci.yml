name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Hex Purity & WCAG Verification (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run single-source-of-truth CI suite
        run: pwsh ./scripts/ci-local.ps1 -CI

  notify:
    name: Discord CI Notification
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch consolidated status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="✅ CI Passed — picotol"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ CI Cancelled — picotol"
          else
            COLOR=15087942
            TITLE="❌ CI Failed — picotol"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true }
                ],
                footer: {
                  text: "GitHub Actions • picotol",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
