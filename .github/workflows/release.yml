name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundles, SRI manifest, and demo
        run: npm run build

      - name: Verify dist/ is clean and up-to-date
        run: git diff --exit-code dist/

      - name: Run CSS AST & Accessibility HTML Linter
        run: npm run lint

      - name: Run Paul Tol test suite
        run: npm test

      - name: Dry-run packaging
        run: npm pack --dry-run

  publish-npm:
    name: Publish to npm Public Registry
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm (Idempotent with Provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on npm public registry..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on npm. Skipping publish step."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VER} to npm with provenance..."
            npm publish --provenance --access public
            echo "Successfully published ${PKG_NAME}@${PKG_VER} to npm."
          fi

  publish-gpr:
    name: Publish to GitHub Packages
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages (Idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on GitHub Packages..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on GitHub Packages. Skipping publish step."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VER} to GitHub Packages..."
            npm publish --registry=https://npm.pkg.github.com/
            echo "Successfully published ${PKG_NAME}@${PKG_VER} to GitHub Packages."
          fi

  attach-assets:
    name: Attach Release Asset Bundles
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundles and generate standalone asset zip
        run: npm run build

      - name: Upload release assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/assets/picotol-v*.zip \
            dist/sri.json \
            dist/manifest.json \
            dist/SHA256SUMS.txt \
            --clobber

  notify:
    name: Discord Release Notification
    needs: [publish-npm, publish-gpr, attach-assets]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch release status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          NPM_STATUS: ${{ needs.publish-npm.result }}
          GPR_STATUS: ${{ needs.publish-gpr.result }}
          ASSETS_STATUS: ${{ needs.attach-assets.result }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="🚀 Release Published — picotol"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ Release Cancelled — picotol"
          else
            COLOR=15087942
            TITLE="❌ Release Failed — picotol"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg tag "$REF_NAME" \
            --arg sha "$SHA" \
            --arg npm "$NPM_STATUS" \
            --arg gpr "$GPR_STATUS" \
            --arg assets "$ASSETS_STATUS" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Tag / Ref", value: $tag, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "npm Registry", value: $npm, inline: true },
                  { name: "GitHub Packages", value: $gpr, inline: true },
                  { name: "Asset Bundle", value: $assets, inline: true }
                ],
                footer: {
                  text: "GitHub Actions • picotol",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
