name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: Verify Release Tag & Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG:-$REF_NAME}"
          PKG_VER=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VER}"
          echo "Comparing release tag '$TAG' with expected tag '$EXPECTED_TAG'..."
          if [ -z "$TAG" ]; then
            echo "::error::No release tag or ref name found."
            exit 1
          fi
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' (v + package.json version)."
            exit 1
          fi
          echo "Release tag '$TAG' matches package.json version $PKG_VER."

  verify:
    name: Verify & Test
    needs: [tag-guard]
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/ci.yml

  publish-npm:
    name: Publish to npm Public Registry
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing (OIDC) Evaluation (Audit A9 / Issue #212):
      # npm trusted publishing enables keyless publishing via GitHub OIDC tokens (id-token: write is configured).
      # However, trusted publishing requires the package owner to configure a trusted publisher binding
      # on npmjs.com (linking github.com/kidthales/picotol to release.yml).
      # Until registered on npmjs.com, removing NPM_TOKEN immediately breaks package releases with ENEEDAUTH.
      # We retain NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} for operational continuity alongside id-token: write.
      - name: Publish to npm (Idempotent with Provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on npm public registry..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on npm. Skipping publish step."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VER} to npm with provenance..."
            npm publish --provenance --access public
            echo "Successfully published ${PKG_NAME}@${PKG_VER} to npm."
          fi

  publish-gpr:
    name: Publish to GitHub Packages
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci

      # zizmor: ignore[use-trusted-publishing] GitHub Packages authenticates via GITHUB_TOKEN packages:write, not OIDC trusted publishing
      - name: Publish to GitHub Packages (Idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VER} already exists on GitHub Packages..."
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "::notice ::Version ${PKG_VER} of ${PKG_NAME} is already published on GitHub Packages. Skipping publish step."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VER} to GitHub Packages..."
            npm publish --registry=https://npm.pkg.github.com/
            echo "Successfully published ${PKG_NAME}@${PKG_VER} to GitHub Packages."
          fi

  attach-assets:
    name: Attach Release Asset Bundles
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundles and generate standalone asset zip
        run: npm run build

      - name: Upload release assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_NAME="${RELEASE_TAG:-$REF_NAME}"
          gh release upload "$TAG_NAME" \
            dist/picotol.core.css \
            dist/picotol.core.min.css \
            dist/picotol.css \
            dist/picotol.layer.css \
            dist/picotol.layer.min.css \
            dist/picotol.min.css \
            LICENSE \
            NOTICE \
            dist/assets/picotol-v*.zip \
            dist/sri.json \
            dist/manifest.json \
            dist/SHA256SUMS.txt \
            --clobber

  notify:
    name: Discord Release Notification
    needs: [tag-guard, verify, publish-npm, publish-gpr, attach-assets]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch release status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          NPM_STATUS: ${{ needs.publish-npm.result }}
          GPR_STATUS: ${{ needs.publish-gpr.result }}
          ASSETS_STATUS: ${{ needs.attach-assets.result || 'skipped' }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="🚀 Release Published — picotol"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ Release Cancelled — picotol"
          else
            COLOR=15087942
            TITLE="❌ Release Failed — picotol"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg tag "$REF_NAME" \
            --arg sha "$SHA" \
            --arg npm "$NPM_STATUS" \
            --arg gpr "$GPR_STATUS" \
            --arg assets "${ASSETS_STATUS:-skipped}" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Tag / Ref", value: $tag, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "npm Registry", value: $npm, inline: true },
                  { name: "GitHub Packages", value: $gpr, inline: true },
                  { name: "Asset Bundle", value: $assets, inline: true }
                ],
                footer: {
                  text: "GitHub Actions • picotol",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
